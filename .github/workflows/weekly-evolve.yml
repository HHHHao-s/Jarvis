name: Weekly Evolve
on:
  schedule:
    # 09:13 Beijing (UTC+8) every Sunday = 01:13 UTC Sunday
    - cron: '13 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v5

      - name: Install Python deps
        run: uv sync

      - name: Configure git
        run: |
          git config user.name "Jarvis Bot"
          git config user.email "bot@jarvis.local"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Run Evolution
        run: claude -p "/evolve" --dangerously-skip-permissions --output-format stream-json --include-partial-messages
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ secrets.ANTHROPIC_HAIKU_MODEL }}
          CLAUDE_CODE_EFFORT_LEVEL : "max"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
