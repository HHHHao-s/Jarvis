theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: 全球日报
tagline: 每日全球资讯精选 + AI 摘要
description: 自动聚合全球各领域资讯，AI 生成中文摘要和标签

url: "https://HHHHao-s.github.io"
baseurl: "/Jarvis"

github:
  username: ""

social:
  name: Jarvis
  links: []

avatar: "https://avatars.githubusercontent.com/u/62682084"

paginate: 10

permalink: /posts/:year-:month-:day-:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - vendor
